name: Build EasyTier JNI
description: 从 EasyTier/EasyTier 上游源码构建 libeasytier_android_jni.so（arm64-v8a），放入 app/src/main/jniLibs
runs:
  using: composite
  steps:
    - name: Checkout EasyTier upstream
      uses: actions/checkout@v4
      with:
        repository: EasyTier/EasyTier
        path: easytier-upstream

    - name: Set up Rust toolchain (跟随上游 rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.95'
        targets: aarch64-linux-android

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: easytier-upstream

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked
      shell: bash

    - name: Build libeasytier_android_jni.so
      env:
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk-bundle
      run: |
        set -e
        # GitHub runner 的 NDK 实际位于版本号目录，选最新的
        if [ ! -d "$ANDROID_NDK_ROOT" ]; then
          ANDROID_NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/* | sort | tail -1)
        fi
        echo "使用 NDK: $ANDROID_NDK_ROOT"
        cd easytier-upstream/easytier-contrib/easytier-ffi
        cargo ndk -t arm64-v8a build --release
        cd ../easytier-android-jni
        cargo ndk -t arm64-v8a build --release
        mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
        cp "$GITHUB_WORKSPACE/easytier-upstream/target/aarch64-linux-android/release/libeasytier_android_jni.so" \
           "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
      shell: bash
