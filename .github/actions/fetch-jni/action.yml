name: Fetch prebuilt EasyTier JNI
description: 从本仓库最新 jni-* Release 下载预编译的 libeasytier_android_jni-<abi>.so 到 app/src/main/jniLibs
runs:
  using: composite
  steps:
    - name: Download prebuilt JNI libs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        UPSTREAM_REPO: "xihale/easytier-android"
      run: |
        set -euo pipefail
        TAG=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/$REPO/releases?per_page=100" |
          jq -r '[.[].tag_name | select(startswith("jni-"))][0] // empty')
        FETCH_REPO="$REPO"
        if [ -z "$TAG" ]; then
          echo "在 $REPO 未找到 jni-* Release，回退到上游仓库 $UPSTREAM_REPO 查询预编译 JNI..."
          FETCH_REPO="$UPSTREAM_REPO"
          TAG=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$FETCH_REPO/releases?per_page=100" |
            jq -r '[.[].tag_name | select(startswith("jni-"))][0] // empty')
        fi
        if [ -z "$TAG" ]; then
          echo "::error::未找到 jni-* 前缀的 Release。请先按 README「JNI 库版本管理」本地构建并上传 .so"
          exit 1
        fi
        echo "使用 JNI 预编译产物: $TAG (来源: $FETCH_REPO)"
        curl -sf -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/$FETCH_REPO/releases/tags/$TAG" |
          jq -r '.assets[] | select(.name | test("^libeasytier_android_jni-.+\\.so$")) | [.name, .browser_download_url] | @tsv' |
        while IFS=$'\t' read -r name url; do
          abi=${name#libeasytier_android_jni-}
          abi=${abi%.so}
          mkdir -p "app/src/main/jniLibs/$abi"
          curl -sfL \
            -o "app/src/main/jniLibs/$abi/libeasytier_android_jni.so" "$url"
          # 附带 .sha256 时校验下载产物（旧的 jni-* Release 可能没有校验和，缺失则跳过）
          if curl -fsSL -o /tmp/jni-checksum.txt "${url}.sha256" 2>/dev/null; then
            expected=$(awk '{print $1}' /tmp/jni-checksum.txt)
            actual=$(sha256sum "app/src/main/jniLibs/$abi/libeasytier_android_jni.so" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::$name sha256 校验失败：期望 $expected，实际 $actual"
              exit 1
            fi
            echo "sha256 校验通过: $name ($actual)"
          else
            echo "警告: $TAG 缺少 $name.sha256，跳过校验"
          fi
          rm -f /tmp/jni-checksum.txt
          echo "已下载 $name -> app/src/main/jniLibs/$abi/"
        done
        ls -la app/src/main/jniLibs/*/
